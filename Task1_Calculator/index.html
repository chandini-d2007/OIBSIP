<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="A simple browser calculator built with HTML, CSS and JavaScript.">
  <title>Calculator</title>
  <link rel="stylesheet" href="style.css">
  <script src="script.js" defer></script>
</head>
<body>
  <main class="calculator" aria-label="Calculator">
    <header class="topbar">
      <div>
        <p class="eyebrow">EVERYDAY TOOL</p>
        <h1>Calculator</h1>
      </div>
      <span class="status-dot" aria-label="Ready"></span>
    </header>

    <section class="display" aria-live="polite" aria-atomic="true">
      <div id="previous-operand" class="previous-operand"></div>
      <div id="current-operand" class="current-operand">0</div>
    </section>

    <section class="keys" aria-label="Calculator keys">
      <button class="key utility" data-action="clear">C</button>
      <button class="key utility" data-action="backspace" aria-label="Backspace">⌫</button>
      <button class="key operator" data-operator="÷">÷</button>
      <button class="key operator" data-operator="×">×</button>

      <button class="key" data-number="7">7</button>
      <button class="key" data-number="8">8</button>
      <button class="key" data-number="9">9</button>
      <button class="key operator" data-operator="−">−</button>

      <button class="key" data-number="4">4</button>
      <button class="key" data-number="5">5</button>
      <button class="key" data-number="6">6</button>
      <button class="key operator" data-operator="+">+</button>

      <button class="key" data-number="1">1</button>
      <button class="key" data-number="2">2</button>
      <button class="key" data-number="3">3</button>
      <button class="key equals" data-action="equals" aria-label="Equals">=</button>

      <button class="key zero" data-number="0">0</button>
      <button class="key" data-action="decimal">.</button>
    </section>
    <p id="message" class="message" role="status"></p>
  </main>
</body>
</html>
